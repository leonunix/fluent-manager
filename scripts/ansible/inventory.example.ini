# Fluent Manager Agent - Ansible Inventory Example
# Copy to inventory.ini and modify for your environment.

[all:vars]
# --- Required ---
fm_server_url=https://fm.example.com
fm_api_key=your-agent-api-key-here

# --- Optional defaults (override per group/host) ---
fm_fluent_type=auto
fm_install_fluentbit=true
fm_agent_version=latest
# fm_agent_download_url=https://releases.example.com/fluent-manager-agent-linux-amd64

[fluentbit_nodes]
# Typical application servers running Fluent Bit
web-01   ansible_host=10.0.1.11
web-02   ansible_host=10.0.1.12
web-03   ansible_host=10.0.1.13
app-01   ansible_host=10.0.2.11   fm_labels='{"team":"backend","env":"production"}'
app-02   ansible_host=10.0.2.12   fm_labels='{"team":"backend","env":"production"}'

[fluentbit_nodes:vars]
fm_fluent_type=fluentbit

[fluentd_nodes]
# Aggregation layer running Fluentd
agg-01   ansible_host=10.0.3.11
agg-02   ansible_host=10.0.3.12

[fluentd_nodes:vars]
fm_fluent_type=fluentd
fm_install_fluentbit=false
fm_install_fluentd=true

[staging]
# Staging environment with different server
staging-01  ansible_host=10.1.1.11  fm_server_url=https://fm-staging.example.com
staging-02  ansible_host=10.1.1.12  fm_server_url=https://fm-staging.example.com

[staging:vars]
fm_labels='{"env":"staging"}'
