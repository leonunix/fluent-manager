---
# ============================================================================
# Install Fluent Bit via official package repository
# ============================================================================

- name: Check if fluent-bit is already installed
  ansible.builtin.command: fluent-bit --version
  register: fb_check
  changed_when: false
  failed_when: false

- name: Install Fluent Bit (Debian/Ubuntu)
  when:
    - fb_check.rc != 0
    - ansible_os_family == "Debian"
  block:
    - name: Add Fluent Bit GPG key
      ansible.builtin.get_url:
        url: https://packages.fluentbit.io/fluentbit.key
        dest: /usr/share/keyrings/fluentbit-keyring.asc
        mode: "0644"

    - name: Add Fluent Bit APT repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/fluentbit-keyring.asc]
          https://packages.fluentbit.io/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}
          {{ ansible_distribution_release }} main
        filename: fluent-bit
        state: present

    - name: Install fluent-bit package
      ansible.builtin.apt:
        name: "fluent-bit{{ ('=' + fm_fluentbit_version) if fm_fluentbit_version else '' }}"
        state: "{{ 'present' if fm_fluentbit_version else 'latest' }}"
        update_cache: true

- name: Install Fluent Bit (RedHat/CentOS)
  when:
    - fb_check.rc != 0
    - ansible_os_family == "RedHat"
  block:
    - name: Add Fluent Bit YUM repository
      ansible.builtin.yum_repository:
        name: fluent-bit
        description: Fluent Bit
        baseurl: https://packages.fluentbit.io/centos/$releasever/$basearch/
        gpgcheck: true
        gpgkey: https://packages.fluentbit.io/fluentbit.key
        enabled: true

    - name: Install fluent-bit package
      ansible.builtin.yum:
        name: "fluent-bit{{ ('-' + fm_fluentbit_version) if fm_fluentbit_version else '' }}"
        state: "{{ 'present' if fm_fluentbit_version else 'latest' }}"

- name: Enable and start fluent-bit service
  ansible.builtin.systemd:
    name: fluent-bit
    enabled: true
    state: started
  when: fb_check.rc != 0

- name: Grant agent group write access to Fluent Bit config directory
  ansible.builtin.file:
    path: "{{ fm_fluentbit_config_dir }}"
    state: directory
    group: "{{ fm_agent_group }}"
    mode: "0775"

- name: Find Fluent Bit config files
  ansible.builtin.find:
    paths: "{{ fm_fluentbit_config_dir }}"
    file_type: file
  register: fb_config_files

- name: Grant agent group write access to Fluent Bit config files
  ansible.builtin.file:
    path: "{{ item.path }}"
    group: "{{ fm_agent_group }}"
    mode: "0664"
  loop: "{{ fb_config_files.files }}"
