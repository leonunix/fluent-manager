---
# ============================================================================
# Install the fluent-manager-agent binary
# ============================================================================

- name: Create agent system group
  ansible.builtin.group:
    name: "{{ fm_agent_group }}"
    system: true
    state: present

- name: Create agent system user
  ansible.builtin.user:
    name: "{{ fm_agent_user }}"
    group: "{{ fm_agent_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present

- name: Add agent user to log-reading groups
  ansible.builtin.user:
    name: "{{ fm_agent_user }}"
    groups: "{{ fm_agent_log_groups }}"
    append: true
  when: fm_agent_log_groups | length > 0

- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ fm_agent_user }}"
    group: "{{ fm_agent_group }}"
    mode: "0755"
  loop:
    - "{{ fm_config_dir }}"
    - "{{ fm_state_dir }}"
    - "{{ fm_runtime_dir }}"

- name: Install agent binary (from local file)
  ansible.builtin.copy:
    src: "{{ fm_agent_binary }}"
    dest: "{{ fm_runtime_dir }}/{{ fm_service_name }}"
    owner: "{{ fm_agent_user }}"
    group: "{{ fm_agent_group }}"
    mode: "0755"
  when: fm_agent_binary | length > 0
  notify: restart fluent-manager-agent

- name: Install agent binary (from remote URL)
  ansible.builtin.get_url:
    url: "{{ fm_agent_download_url }}"
    dest: "{{ fm_runtime_dir }}/{{ fm_service_name }}"
    owner: "{{ fm_agent_user }}"
    group: "{{ fm_agent_group }}"
    mode: "0755"
  when:
    - fm_agent_binary | length == 0
    - fm_agent_download_url | length > 0
  notify: restart fluent-manager-agent

- name: Create convenience symlink for agent binary
  ansible.builtin.file:
    src: "{{ fm_runtime_dir }}/{{ fm_service_name }}"
    dest: "{{ fm_install_dir }}/{{ fm_service_name }}"
    state: link
    force: true

- name: Verify agent binary
  ansible.builtin.command:
    cmd: "{{ fm_runtime_dir }}/{{ fm_service_name }} --version"
  register: fm_agent_version_output
  changed_when: false
  failed_when: fm_agent_version_output.rc != 0

- name: Show agent version
  ansible.builtin.debug:
    msg: "{{ fm_agent_version_output.stdout }}"

- name: Install polkit rule to allow agent user to manage fluent services
  ansible.builtin.copy:
    dest: /etc/polkit-1/rules.d/50-fluent-manager-agent.rules
    owner: root
    group: root
    mode: "0644"
    content: |
      // Allow fluent-manager-agent user to manage Fluent Bit / Fluentd services
      polkit.addRule(function(action, subject) {
          var units = [
              "fluent-bit.service",
              "td-agent.service",
              "fluentd.service"
          ];
          if (action.id === "org.freedesktop.systemd1.manage-units" &&
              units.indexOf(action.lookup("unit")) !== -1 &&
              subject.user === "{{ fm_agent_user }}") {
              return polkit.Result.YES;
          }
      });
